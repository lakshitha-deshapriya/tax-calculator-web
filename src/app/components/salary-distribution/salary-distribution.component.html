<div class="salary-distribution-container">
  <div class="header-section">
    <!-- Financial Year Selection and View Mode -->
    <div class="controls-section">
      <div class="control-group">
        <label for="financialYear">Financial Year:</label>
        <select 
          id="financialYear"
          [(ngModel)]="selectedFinancialYear" 
          (ngModelChange)="onFinancialYearChange()"
          class="financial-year-select"
        >
          <option *ngFor="let fy of availableFinancialYears" [ngValue]="fy">
            {{ fy.label }}
          </option>
        </select>
      </div>
      
      <div class="control-group">
        <label for="viewMode">View:</label>
        <select 
          id="viewMode"
          [(ngModel)]="viewMode" 
          (ngModelChange)="onViewModeChange()"
          class="view-mode-select"
        >
          <option value="breakdown">Net Salary Breakdown</option>
          <option value="detailed">Detailed View</option>
          <option value="investments">Investments</option>
        </select>
      </div>
      
      <div class="control-group config-note">
        <span class="config-hint">💡 Configure EPF/ETF rates and distribution categories in Settings</span>
      </div>
    </div>
  </div>

  <!-- Content Views -->

  <!-- No Data Message -->
  <div class="no-data-message" *ngIf="!selectedFinancialYear || monthlyBreakdowns.length === 0">
    <div class="no-data-content">
      <h3>📋 No Salary Data Available</h3>
      <p>Please add salary entries in the <strong>Salary Management</strong> tab to see your distribution breakdown.</p>
    </div>
  </div>

  <!-- Monthly Breakdown Cards - Detailed View -->
  <app-detailed-view 
    *ngIf="selectedFinancialYear && monthlyBreakdowns.length > 0 && viewMode === 'detailed'"
    [monthlyBreakdowns]="monthlyBreakdowns"
    [taxConfig]="taxConfig"
    [selectedFinancialYear]="selectedFinancialYear">
  </app-detailed-view>

  <!-- Net Salary Breakdown Table View (Default) -->
  <app-net-breakdown 
    *ngIf="selectedFinancialYear && monthlyBreakdowns.length > 0 && viewMode === 'breakdown'"
    [monthlyBreakdowns]="monthlyBreakdowns"
    [taxConfig]="taxConfig"
    [selectedFinancialYear]="selectedFinancialYear">
  </app-net-breakdown>

  <!-- Investments View -->
  <app-investments-view 
    *ngIf="selectedFinancialYear && monthlyBreakdowns.length > 0 && viewMode === 'investments'"
    [monthlyBreakdowns]="monthlyBreakdowns"
    [taxConfig]="taxConfig"
    [selectedFinancialYear]="selectedFinancialYear">
  </app-investments-view>
</div>
