<div class="container">
  <header class="header">
    <div class="header-content">
      <div class="title-section">
        <h1>{{ title }}</h1>
        <p class="subtitle">Calculate your income tax with real-time currency exchange rates from CBSL</p>
      </div>
      
      <!-- Profile Button -->
      <div class="profile-section">
        <div *ngIf="!isSignedIn" class="sign-in-btn-container">
          <div #googleSignInButton class="google-signin-wrapper"></div>
        </div>
        
        <div *ngIf="isSignedIn && currentUser" class="profile-dropdown" clickOutside (clickOutside)="closeProfileDropdown()">>
          <button class="profile-btn" (click)="toggleProfileDropdown()">
            <img [src]="currentUser.picture" [alt]="currentUser.name" class="profile-avatar">
            <span class="profile-name">{{ currentUser.name }}</span>
            <span class="dropdown-arrow" [class.open]="showProfileDropdown">▼</span>
          </button>
          
          <div class="dropdown-menu" *ngIf="showProfileDropdown">
            <div class="dropdown-header">
              <img [src]="currentUser.picture" [alt]="currentUser.name" class="dropdown-avatar">
              <div class="user-info">
                <div class="user-name">{{ currentUser.name }}</div>
                <div class="user-email">{{ currentUser.email }}</div>
              </div>
            </div>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item sign-out-item" (click)="signOut()">
              <span class="item-icon">🚪</span>
              Sign Out
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <div class="tab-navigation">
    <button 
      class="tab-button" 
      [class.active]="activeTab === 'settings'"
      (click)="activeTab = 'settings'"
    >
      Settings
    </button>
    <button 
      class="tab-button" 
      [class.active]="activeTab === 'salary'"
      (click)="activeTab = 'salary'"
    >
      Salary Management
    </button>
    <button 
      class="tab-button" 
      [class.active]="activeTab === 'calculator'"
      (click)="activeTab = 'calculator'"
    >
      Tax Calculator
    </button>
    <button 
      class="tab-button" 
      [class.active]="activeTab === 'exchange'"
      (click)="activeTab = 'exchange'"
    >
      Exchange Rates
    </button>
    <!-- Admin only tab -->
    <button 
      *ngIf="isAdmin"
      class="tab-button admin-tab" 
      [class.active]="activeTab === 'distribution'"
      (click)="activeTab = 'distribution'"
      title="Admin Only: Salary Distribution Analysis"
    >
      💰 Salary Distribution
    </button>
  </div>

  <main class="main-content">
    
    <!-- Settings Tab -->
    <div *ngIf="activeTab === 'settings'" class="tab-content">
      <app-settings 
        [taxConfig]="taxConfig" 
        (configChanged)="onConfigChanged()">
      </app-settings>
    </div>

    <!-- Salary Management Tab -->
    <div *ngIf="activeTab === 'salary'" class="tab-content">
      <app-salary-management 
        [taxConfig]="taxConfig" 
        (configChanged)="onConfigChanged()">
      </app-salary-management>
    </div>

    <!-- Tax Calculator Tab -->
    <div *ngIf="activeTab === 'calculator'" class="tab-content">
      <app-tax-calculator 
        [taxConfig]="taxConfig">
      </app-tax-calculator>
    </div>

    <!-- Exchange Rate Lookup Tab -->
    <div *ngIf="activeTab === 'exchange'" class="tab-content">
      <app-exchange-rate></app-exchange-rate>
    </div>

    <!-- Admin Only: Salary Distribution Tab -->
    <div *ngIf="activeTab === 'distribution' && isAdmin" class="tab-content">
      <app-salary-distribution></app-salary-distribution>
    </div>
  </main>
  
  <!-- Debug Panel (only in development) -->
  <app-debug-panel></app-debug-panel>
</div>
