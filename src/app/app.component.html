<div class="container">
  <header class="header">
    <h1>{{ title }}</h1>
    <p class="subtitle">Calculate your income tax with real-time currency exchange rates from CBSL</p>
  </header>

  <!-- Navigation Tabs -->
  <div class="tab-navigation">
    <button 
      class="tab-button" 
      [class.active]="activeTab === 'settings'"
      (click)="activeTab = 'settings'"
    >
      Settings
    </button>
    <button 
      class="tab-button" 
      [class.active]="activeTab === 'salary'"
      (click)="activeTab = 'salary'"
    >
      Salary Management
    </button>
    <button 
      class="tab-button" 
      [class.active]="activeTab === 'calculator'"
      (click)="activeTab = 'calculator'"
    >
      Tax Calculator
    </button>
    <button 
      class="tab-button" 
      [class.active]="activeTab === 'exchange'"
      (click)="activeTab = 'exchange'"
    >
      Exchange Rates
    </button>
  </div>

  <main class="main-content">
    
    <!-- Settings Tab -->
    <div *ngIf="activeTab === 'settings'" class="tab-content">
      <app-settings 
        [taxConfig]="taxConfig" 
        (configChanged)="onConfigChanged()">
      </app-settings>
    </div>

    <!-- Salary Management Tab -->
    <div *ngIf="activeTab === 'salary'" class="tab-content">
      <app-salary-management 
        [taxConfig]="taxConfig" 
        (configChanged)="onConfigChanged()">
      </app-salary-management>
    </div>

    <!-- Tax Calculator Tab -->
    <div *ngIf="activeTab === 'calculator'" class="tab-content">
      <app-tax-calculator 
        [taxConfig]="taxConfig">
      </app-tax-calculator>
    </div>

    <!-- Exchange Rate Lookup Tab -->
    <div *ngIf="activeTab === 'exchange'" class="tab-content">
      <app-exchange-rate></app-exchange-rate>
    </div>
  </main>
</div>
